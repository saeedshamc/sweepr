[package]
name = "sweepr"
version = "0.1.0"
description = "Cross-platform junk file scanner and cleanup tool"
authors = ["Sweepr"]
edition = "2021"

[lib]
name = "sweepr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
walkdir = "2"
